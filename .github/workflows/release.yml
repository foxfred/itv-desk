# ITV Desk — 发布流水线（构建 + 自动上传 GitHub Release + 回填 update.json）
# 打 tag v* → 前端构建 → 后端校验 → electron-builder 打 NSIS/便携版 → 自动上传 Release 资产 → 回填 update.json
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============ 1. 前端构建 + 后端校验 ============
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装根依赖
        run: npm ci

      - name: 安装前端依赖并构建
        working-directory: frontend-new
        run: |
          npm ci
          npm run build

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install httpx pytest

      - name: 后端语法 + 导入校验
        run: |
          python -m compileall -q backend
          python -c "import sys; sys.path.insert(0,'backend'); import app.main; print('后端导入成功')"

      - name: 运行后端冒烟测试
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: 上传前端 dist + 后端源码
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: |
            frontend-new/dist
            backend
          retention-days: 1

  # ============ 2. Windows 打版 + 发布 ============
  build-and-publish:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 恢复前端 dist + 后端源码
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: .

      - name: 安装根依赖
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm ci

      - name: 安装 Electron
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npx electron --version

      # electron-builder 带 GITHUB_TOKEN + publish:github 配置，自动上传 Release 资产
      - name: 打包 NSIS + 便携版 + 自动发布到 GitHub Release
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          npm run dist:folder
          npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        run: |
          Get-ChildItem -Recurse dist_electron -Filter *.exe | Select-Object FullName, Length | Format-Table

      # 兜底：产物上传为 workflow artifact（保留 30 天）
      - name: 上传构建产物（兜底）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: itvdesk-build-${{ github.ref_name }}
          path: dist_electron/**
          retention-days: 30

      # 回填 release/update.json 里 exe 的真实 sha256 + size，并推回 master
      - name: 回填 update.json 并推送 master
        if: ${{ !cancelled() }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "version: $ver"

          $nsisFile = Get-ChildItem -Path dist_electron -Filter "*Setup*.exe" -Recurse | Select-Object -First 1
          $portFile = Get-ChildItem -Path dist_electron -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "*Setup*" -and $_.Name -like "ITV*" } | Select-Object -First 1

          $nsisSha = if ($nsisFile) { (Get-FileHash -Path $nsisFile.FullName -Algorithm SHA256).Hash.ToLower() } else { "PENDING" }
          $portSha = if ($portFile) { (Get-FileHash -Path $portFile.FullName -Algorithm SHA256).Hash.ToLower() } else { "PENDING" }
          $nsisSize = if ($nsisFile) { $nsisFile.Length } else { 0 }
          $portSize = if ($portFile) { $portFile.Length } else { 0 }
          $portName = if ($portFile) { [IO.Path]::GetFileName($portFile.FullName) } else { "ITV Desk $ver.exe" }
          $nsisName = if ($nsisFile) { [IO.Path]::GetFileName($nsisFile.FullName) } else { "ITV Desk Setup $ver.exe" }
          $portUrl = "https://github.com/foxfred/itv-desk/releases/download/v$ver/" + ($portName -replace ' ', '-')
          $nsisUrl = "https://github.com/foxfred/itv-desk/releases/download/v$ver/" + ($nsisName -replace ' ', '-')

          $update = [ordered]@{
            version = $ver
            notes = "v$ver：接入 GitHub Actions CI/CD，自更新地址指向 GitHub Release 资产。"
            packages = @(
              [ordered]@{ name = $portName; url = $portUrl; sha256 = $portSha; size = $portSize; role = "main" },
              [ordered]@{ name = $nsisName; url = $nsisUrl; sha256 = $nsisSha; size = $nsisSize; role = "main" }
            )
          }
          $json = $update | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("$PWD/release/update.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "update.json written:"
          Get-Content release/update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/update.json
          git commit -m "chore: backfill update.json with real sha256 for v$ver [skip ci]"
          git push origin HEAD:master
