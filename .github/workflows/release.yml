# ITV Desk — 发布流水线（构建 + 自动上传 GitHub Release + 回填 update.json）
# 打 tag v* → 前端构建 → 后端校验 → electron-builder 打 NSIS/便携版 → 自动上传 Release 资产 → 回填 update.json
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============ 1. 前端构建 + 后端校验 ============
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装根依赖
        run: npm ci

      - name: 安装前端依赖并构建
        working-directory: frontend-new
        run: |
          npm ci
          npm run build

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install httpx pytest

      - name: 后端语法 + 导入校验
        run: |
          python -m compileall -q backend
          python -c "import sys; sys.path.insert(0,'backend'); import app.main; print('后端导入成功')"

      - name: 运行后端冒烟测试
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: 上传前端 dist + 后端源码
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: |
            frontend-new/dist
            backend
          retention-days: 1

  # ============ 2. Windows 打版 + 发布 ============
  build-and-publish:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 恢复前端 dist + 后端源码
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: .

      - name: 安装根依赖
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm ci

      - name: 安装 Electron
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npx electron --version

      # electron-builder 带 GITHUB_TOKEN + publish:github 配置，自动上传 Release 资产
      - name: 打包 NSIS + 便携版 + 自动发布到 GitHub Release
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          npm run dist:folder
          npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        run: |
          Get-ChildItem -Recurse dist_electron -Filter *.exe | Select-Object FullName, Length | Format-Table

      # 兜底：产物上传为 workflow artifact（保留 30 天）
      - name: 上传构建产物（兜底）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: itvdesk-build-${{ github.ref_name }}
          path: dist_electron/**
          retention-days: 30

      # 文件夹版：把 win-unpacked 打 zip 挂到 Release（给便携文件夹用户覆盖升级用）
      - name: 上传文件夹版 zip 到 Release
        if: ${{ !cancelled() }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "dist_electron/ITV-Desk-$ver-folder.zip"
          Compress-Archive -Path "dist_electron/win-unpacked/*" -DestinationPath $zip -Force
          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          gh release upload "v$ver" $zip --repo foxfred/itv-desk --clobber
          Write-Host "folder zip uploaded: $zip"

      # Release 标题规范：统一成「ITV Desk vX.Y.Z」（与 v3.0.2 / v3.1.0 等历史版本一致）。
      # 为什么改标题而不是改标签：git 标签名不允许出现空格（refname 规则禁止空格/~/^/:/* 等），
      # 而更新链路（update.json 的 url、安装包文件名、CI 里的 v$ver）全都依赖 vX.Y.Z 形式的标签，
      # 所以「ITV Desk vX.Y.Z」这个对外显示名只能落在 Release 标题上。
      - name: 统一 Release 标题为「ITV Desk vX.Y.Z」
        if: ${{ !cancelled() }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          gh release edit "v$ver" --title "ITV Desk v$ver" --repo foxfred/itv-desk
          if ($LASTEXITCODE -ne 0) { throw "设置 Release 标题失败: v$ver" }
          Write-Host "release title set: ITV Desk v$ver"

      # 回填 release/update.json：只挂「文件夹版 zip」一个包（软件内自更新用的就是这个）。
      # 为什么只挂 zip：zip 解压后能直接覆盖「当前程序所在目录」，版本号一定会刷新；
      # 而 exe 安装包会在向导里装到 %LOCALAPPDATA%\Programs 等默认目录，
      # 与用户实际打开的目录不是一处 —— v3.1.1 的「更新后版本号没变」就是这个原因。
      - name: 回填 update.json 并推送 master
        if: ${{ !cancelled() }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "version: $ver"

          $zipName = "ITV-Desk-$ver-folder.zip"
          $zipPath = "dist_electron/$zipName"
          if (-not (Test-Path $zipPath)) { throw "folder zip 不存在，无法回填 update.json: $zipPath" }
          $zipSha = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          $zipSize = (Get-Item -Path $zipPath).Length
          $zipUrl = "https://github.com/foxfred/itv-desk/releases/download/v$ver/$zipName"

          # 保留仓库里已写好的更新说明（若为空或过短才退回默认文案）
          $notes = "ITV Desk v$ver 更新。"
          try {
            $oldNotes = (Get-Content release/update.json -Raw -Encoding UTF8 | ConvertFrom-Json).notes
            if ($oldNotes -and "$oldNotes".Length -gt 20) { $notes = $oldNotes }
          } catch { Write-Host "keep default notes" }

          $update = [ordered]@{
            version = $ver
            notes = $notes
            packages = @(
              [ordered]@{ name = $zipName; url = $zipUrl; sha256 = $zipSha; size = $zipSize; role = "folder" }
            )
          }
          $json = $update | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText("$PWD/release/update.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "update.json written:"
          Get-Content release/update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/update.json
          git commit -m "chore: backfill update.json with real sha256 for v$ver [skip ci]"
          git push origin HEAD:master
