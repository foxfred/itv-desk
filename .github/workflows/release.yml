# ITV Desk — 发布流水线（构建 + 部署 = 打版 + GitHub Release）
# 桌面应用无服务器部署，"部署"落地为 GitHub Release 自动发布:
#   打 tag v* → 前端构建 → 后端校验 → electron-builder 打 NSIS/便携版 → 上传 Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============ 1. 前端构建 + 后端校验 ============
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装根依赖
        run: npm ci

      - name: 安装前端依赖并构建
        working-directory: frontend-new
        run: |
          npm ci
          npm run build

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install httpx pytest

      - name: 后端语法 + 导入校验
        run: |
          python -m compileall -q backend
          python -c "import sys; sys.path.insert(0,'backend'); import app.main; print('后端导入成功')"

      - name: 运行后端冒烟测试
        working-directory: backend
        run: python -m pytest tests/ -v

      # 把前端产物 + 后端源码带进 Windows 打包 job
      - name: 上传前端 dist + 后端源码
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: |
            frontend-new/dist
            backend
          retention-days: 1

  # ============ 2. Windows 打版 + 发布 ============
  build-and-publish:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 恢复前端 dist + 后端源码
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: .

      - name: 安装根依赖
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm ci

      - name: 安装 Electron
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npx electron --version

      # ---- 打包：--dir 只打文件夹，不自动发 release，避免 electron-builder 尝试自动发布 ----
      - name: 打包 NSIS + 便携版
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npx electron-builder --dir --win
          npx electron-builder --win

      - name: 列出产物
        run: |
          Get-ChildItem -Recurse dist_electron | Select-Object FullName, Length | Format-Table

      # ---- 上传为 workflow artifact（始终执行，供手动下载或 CI 排查） ----
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: itvdesk-build-${{ github.ref_name }}
          path: dist_electron/**
          retention-days: 30

      # ---- 上传 Release 资产（仅在 tag 推送时执行，手动触发不上传） ----
      - name: 上传 Release 资产
        if: github.event_name == 'push'
        run: |
          # 收集 exe 和 nsis installer
          $files = Get-ChildItem -Path "dist_electron" -Recurse -File -Include "*.exe","*.zip"
          Write-Host "共 $($files.Count) 个资产待上传"
          foreach ($f in $files) {
            Write-Host "上传: $($f.Name)"
            gh release upload ${{ github.ref_name }} $f.FullName --repo foxfred/itv-desk --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
