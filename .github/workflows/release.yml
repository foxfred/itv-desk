# ITV Desk — 发布流水线（构建 + 部署 = 打版 + GitHub Release）
# 桌面应用无服务器部署，"部署"落地为 GitHub Release 自动发布:
#   打 tag v* → 前端构建 → 后端校验 → electron-builder 打 NSIS/便携版 → 自动上传 Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============ 1. 前端构建 + 后端校验 ============
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装根依赖
        run: npm ci

      - name: 安装前端依赖并构建
        working-directory: frontend-new
        run: |
          npm ci
          npm run build

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install httpx pytest

      - name: 后端语法 + 导入校验
        run: |
          python -m compileall -q backend
          python -c "import sys; sys.path.insert(0,'backend'); import app.main; print('后端导入成功')"

      - name: 运行后端冒烟测试
        working-directory: backend
        run: python -m pytest tests/ -v

      # 把前端产物 + 后端源码带进 Windows 打包 job
      - name: 上传前端 dist + 后端源码
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: |
            frontend-new/dist
            backend
          retention-days: 1

  # ============ 2. Windows 打版 + 发布 ============
  build-and-publish:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 恢复前端 dist + 后端源码
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: .

      - name: 安装根依赖
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm ci

      - name: 安装 Electron
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npx electron --version

      # electron-builder 检测到 CI + GITHUB_TOKEN 后，会自动创建/更新 Release 并上传资产
      - name: 打包 NSIS + 便携版 + 自动发布到 GitHub Release
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
          npm run dist:folder
          npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        run: |
          Get-ChildItem -Recurse dist_electron | Select-Object FullName, Length | Format-Table

      # 兜底：无论发布成功与否，都把产物上传为 workflow artifact（保留 30 天）
      - name: 上传构建产物（兜底）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: itvdesk-build-${{ github.ref_name }}
          path: dist_electron/**
          retention-days: 30
