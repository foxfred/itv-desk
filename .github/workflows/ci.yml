# ITV Desk — CI 流水线（lint → test）
# 桌面应用（Electron+FastAPI+Vue3）没有"传统部署"，本流水线负责:
#   1. 前端构建校验 + 后端语法/导入校验 (lint 阶段)
#   2. 后端 FastAPI 冒烟测试 + 前端产物完整性校验 (test 阶段)
# 发布（打版 + GitHub Release）见 release.yml，由 tag 触发。
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "electron/**"
      - "backend/**"
      - "frontend-new/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "electron/**"
      - "backend/**"
      - "frontend-new/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# 同一分支/PR 只保留最新一次运行，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================= 1. 前端构建 + 后端静态校验 =================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 根 package-lock.json 锁住 Electron 与 electron-builder

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装根依赖（Electron / electron-builder）
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend-new
        run: npm ci

      - name: 构建前端（vite build → dist）
        working-directory: frontend-new
        run: npm run build

      - name: 校验前端产物完整性
        run: |
          test -f frontend-new/dist/index.html
          test -d frontend-new/dist/assets
          test -f frontend-new/dist/build-info.json
          echo "前端产物 OK"

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install httpx

      - name: 后端语法编译 + 顶层导入校验
        run: |
          python -m compileall -q backend
          python -c "import sys; sys.path.insert(0,'backend'); import app.main; print('后端 app.main 导入成功')"

      - name: Electron 主进程语法校验
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/ipc-handlers.js
          node electron/tests/self-check.js
          echo "Electron 三文件语法 OK"

  # ================= 2. 后端冒烟 + 前端产物校验（依赖 lint 产物） =================
  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: 运行 pytest 冒烟测试
        working-directory: backend
        run: |
          python -m pip install pytest
          python -m pytest tests/ -v

      - name: FastAPI 启动 + 端点健康检查
        run: |
          cd backend
          python -c "
          import os, sys, json
          sys.path.insert(0, '.')
          # 使用临时数据目录，避免污染工作区
          os.environ['ITV_DATA_DIR'] = os.environ['GITHUB_WORKSPACE']
          from app.main import app
          from fastapi.testclient import TestClient
          c = TestClient(app)
          r = c.get('/api/stats')
          print('GET /api/stats ->', r.status_code, r.json())
          assert r.status_code == 200
          r2 = c.get('/api/logs')
          assert r2.status_code == 200
          print('后端健康检查通过')
          "
