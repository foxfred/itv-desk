appId: com.itvdesk.pro
productName: ITV Desk
copyright: Copyright © 2026

directories:
  output: dist_electron

files:
  - electron/**/*
  - package.json

extraResources:
  - from: frontend-new/dist
    to: frontend-new/dist
    filter:
      - "**/*"
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!**/__pycache__/**"
      - "!*.pyc"
      - "!**/*.pyc"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ITV Desk
  artifactName: "ITV-Desk-Setup-${version}.${ext}"

portable:
  artifactName: "ITV-Desk-${version}.${ext}"

publish:
  provider: github
  owner: foxfred
  repo: itv-desk
  releaseType: release
